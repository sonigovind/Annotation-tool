<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pushpak</title>
    <meta name="theme-color" content="#121515" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      const isLocalDev =
        location.hostname === 'localhost' ||
        location.hostname === '127.0.0.1' ||
        location.port !== '';

      if (isLocalDev) {
        import('/src/main.tsx');
      } else {
        location.replace('./dist/index.html');
      }
    </script>
  </body>
</html>
